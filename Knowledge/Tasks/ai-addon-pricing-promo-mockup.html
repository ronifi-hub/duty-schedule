<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI Work Platform pricing — Figma v3 mock</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --text: #323338;
      --muted: #676879;
      --border: #e7e9ef;
      --bg: #ffffff;
      --page-bg: #f4f7fb;
      --green: #00c875;
      --blue: #0073ea;
      --radius-lg: 12px;
      --radius-md: 8px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Figtree, system-ui, sans-serif;
      background: var(--page-bg);
      color: var(--text);
      min-height: 100vh;
    }
    .toolbar {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px 20px;
      padding: 12px 20px;
      background: #1f1f21;
      color: #fff;
      font-size: 14px;
    }
    .toolbar label { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; }
    .toolbar input[type="number"] {
      width: 64px;
      padding: 6px 8px;
      border-radius: 6px;
      border: 1px solid #555;
      background: #2a2d38;
      color: #fff;
      font: inherit;
    }
    .toolbar .hint { opacity: 0.75; font-size: 13px; max-width: 520px; }

    .page {
      max-width: 920px;
      margin: 0 auto;
      padding: 28px 20px 48px;
    }

    .v3-wrap {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 32px 28px 36px;
      box-shadow: 0 1px 3px rgba(0,0,0,.04);
    }

    .v3-header {
      text-align: center;
      margin-bottom: 28px;
    }
    .v3-title {
      margin: 0 0 10px;
      font-size: 22px;
      font-weight: 700;
      line-height: 1.25;
      letter-spacing: -0.02em;
      max-width: 42ch;
      margin-left: auto;
      margin-right: auto;
    }
    .v3-sub {
      margin: 0 0 16px;
      font-size: 15px;
      color: var(--muted);
      line-height: 1.45;
      max-width: 48ch;
      margin-left: auto;
      margin-right: auto;
    }
    .v3-meta {
      margin: 0;
      font-size: 14px;
      color: var(--muted);
      display: inline-flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .v3-meta strong { color: var(--text); font-weight: 700; }
    .v3-meta svg { flex-shrink: 0; opacity: 0.7; }

    .compare-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 36px;
    }
    @media (max-width: 720px) {
      .compare-row { grid-template-columns: 1fr; }
    }

    .plan-card {
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 18px 18px 20px;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      min-height: 100%;
    }
    .plan-card__title {
      margin: 0 0 14px;
      font-size: 16px;
      font-weight: 700;
    }
    .tier-select {
      width: 100%;
      padding: 10px 12px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border);
      font: inherit;
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
      background: #fafbfc;
      margin-bottom: 16px;
      cursor: pointer;
    }
    .youll-receive {
      margin: 0 0 18px;
      font-size: 12px;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .feature-list {
      list-style: none;
      margin: 0 0 22px;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .feature-list li {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      font-size: 14px;
      color: var(--text);
      line-height: 1.35;
    }
    .feature-list .check {
      color: var(--green);
      font-weight: 900;
      flex-shrink: 0;
      margin-top: 2px;
    }
    .plan-card__price {
      font-family: Poppins, sans-serif;
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin: auto 0 16px;
    }
    .plan-card__price .per { font-size: 15px; font-weight: 600; color: var(--muted); }
    .plan-card__price-row {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 4px;
      margin: auto 0 16px;
    }
    .plan-card__price-row .strike {
      font-size: 15px;
      font-weight: 600;
      color: var(--muted);
      text-decoration: line-through;
      text-decoration-thickness: 1.5px;
    }
    .plan-card__price-row .net {
      font-family: Poppins, sans-serif;
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    .plan-card__price-row .net.is-zero { color: var(--green); }
    .plan-card__price-row .per { font-size: 15px; font-weight: 600; color: var(--muted); }

    .btn-purchase {
      width: 100%;
      padding: 12px 16px;
      border-radius: var(--radius-md);
      border: 1px solid #1f1f21;
      background: #fff;
      color: #1f1f21;
      font: inherit;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-purchase:hover { background: #f8f9fc; }
    .btn-update {
      width: 100%;
      padding: 12px 16px;
      border-radius: var(--radius-md);
      border: none;
      background: #1f1f21;
      color: #fff;
      font: inherit;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-update:hover { background: #333; }

    /* Promo card — gradient frame + top banner */
    .plan-card--platform {
      padding: 0;
      border: none;
      background: linear-gradient(135deg, #7c6bff, #a78bfa, #ec4899, #22d3d0);
      border-radius: calc(var(--radius-lg) + 2px);
      overflow: hidden;
    }
    .plan-card--platform-inner {
      margin: 3px;
      border-radius: calc(var(--radius-lg) - 1px);
      background: var(--bg);
      padding: 0 18px 20px;
      display: flex;
      flex-direction: column;
      min-height: 100%;
    }
    .platform-banner {
      margin: 0 -18px 14px;
      padding: 10px 18px;
      background: #3d3d42;
      color: #fff;
      font-size: 13px;
      font-weight: 700;
      text-align: center;
    }

    /* Value section */
    .value-done {
      border-top: 1px solid var(--border);
      padding-top: 28px;
    }
    .value-done__title {
      margin: 0 0 18px;
      font-size: 17px;
      font-weight: 700;
      text-align: center;
    }
    .trial-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }
    .trial-row .lbl { font-size: 14px; font-weight: 700; }
    .trial-row .nums { font-size: 14px; font-weight: 700; }
    .trial-row .nums span { font-weight: 600; color: var(--muted); font-size: 12px; margin-left: 4px; }
    .trial-bar-frame {
      padding: 6px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: #fff;
      margin-bottom: 22px;
    }
    .trial-bar {
      height: 10px;
      border-radius: 999px;
      background: #f0f1f5;
      overflow: hidden;
      border: 1px solid #eef0f6;
    }
    .trial-bar > span {
      display: block;
      height: 100%;
      width: 100%;
      background: #e2445c;
    }

    /*
      Usage infographic — design intent:
      (1) One “composition” read: where trial credits went (single segmented bar + aligned key).
      (2) Separate layer: work outcomes (big number = human metric; credits = one caption line keyed to color).
      Avoid duplicate micro-bars that fight the master chart.
    */
    .usage-panel {
      margin-top: 4px;
      padding: 22px 20px 24px;
      border-radius: 14px;
      background: #f6f7fb;
      border: 1px solid #e8eaf2;
    }
    .usage-eyebrow {
      margin: 0 0 8px;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #8b8fa3;
      text-align: center;
    }
    .usage-composition {
      margin-bottom: 8px;
    }
    .usage-composition__bar {
      display: flex;
      height: 14px;
      border-radius: 8px;
      overflow: hidden;
      background: #e4e6ef;
      box-shadow: inset 0 1px 2px rgba(0,0,0,.06);
    }
    .usage-composition__seg {
      height: 100%;
      min-width: 3px;
      transition: filter 0.15s ease, transform 0.15s ease;
    }
    .usage-composition__seg:hover {
      filter: brightness(1.06);
    }
    .usage-composition__key {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0;
      margin-top: 10px;
      border-top: 1px solid #e2e5ee;
      padding-top: 10px;
    }
    @media (max-width: 640px) {
      .usage-composition__key {
        grid-template-columns: repeat(2, 1fr);
        gap: 10px 12px;
      }
    }
    .usage-key-cell {
      text-align: center;
      padding: 0 6px;
      border-right: 1px solid #eceef5;
    }
    .usage-key-cell:last-child { border-right: none; }
    @media (max-width: 640px) {
      .usage-key-cell { border-right: none; text-align: left; padding: 0; }
    }
    .usage-key-cell__dot {
      width: 8px;
      height: 8px;
      border-radius: 99px;
      margin: 0 auto 6px;
    }
    @media (max-width: 640px) {
      .usage-key-cell__dot { margin: 0 0 6px 0; }
    }
    .usage-key-cell__name {
      font-size: 11px;
      font-weight: 800;
      color: var(--text);
      letter-spacing: 0.02em;
      margin-bottom: 2px;
    }
    .usage-key-cell__pct {
      font-family: Poppins, sans-serif;
      font-size: 18px;
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1.1;
      color: var(--text);
    }
    .usage-key-cell__cr {
      font-size: 11px;
      font-weight: 600;
      color: var(--muted);
      margin-top: 2px;
    }
    .usage-panel__rule {
      border: none;
      height: 1px;
      background: #e2e5ee;
      margin: 22px 0 18px;
    }
    .usage-detail-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
    }
    @media (max-width: 860px) {
      .usage-detail-grid { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 440px) {
      .usage-detail-grid { grid-template-columns: 1fr; }
    }
    .usage-tile {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px 14px 14px;
      text-align: left;
      box-shadow: 0 1px 2px rgba(18, 19, 28, 0.04);
    }
    .usage-tile__top {
      display: flex;
      gap: 12px;
      align-items: flex-start;
      margin-bottom: 12px;
    }
    .usage-tile__icon {
      width: 44px;
      height: 44px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .usage-tile__brand {
      font-size: 11px;
      font-weight: 800;
      color: #8b8fa3;
      text-transform: lowercase;
      letter-spacing: 0.04em;
      margin-bottom: 6px;
    }
    .usage-tile__metric {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 6px 8px;
      margin-bottom: 6px;
    }
    .usage-tile__num {
      font-family: Poppins, sans-serif;
      font-size: 30px;
      font-weight: 800;
      letter-spacing: -0.04em;
      line-height: 1;
      color: var(--text);
    }
    .usage-tile__unit {
      font-size: 13px;
      font-weight: 700;
      color: var(--text);
      opacity: 0.92;
    }
    .usage-tile__insight {
      margin: 0;
      font-size: 12px;
      line-height: 1.4;
      color: var(--muted);
      font-weight: 500;
    }
    .usage-tile__credit {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid #f0f1f5;
      font-size: 11px;
      font-weight: 700;
      color: var(--muted);
      letter-spacing: 0.02em;
    }
    .usage-tile__credit-dot {
      width: 8px;
      height: 8px;
      border-radius: 99px;
      flex-shrink: 0;
    }
    .usage-tile__credit strong {
      color: var(--text);
      font-weight: 800;
    }

    .legal {
      margin-top: 20px;
      font-size: 11px;
      color: var(--muted);
      line-height: 1.4;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="toolbar">
    <label>
      Promo discount ($ / month)
      <input type="number" id="discount" value="30" min="0" max="999" />
    </label>
    <span class="hint">Applied only to <strong>AI Work Platform</strong> card net price. Figma: <a href="https://www.figma.com/design/ErzdM0aHRUDyi4aJf4QPVd/AI-Credits?node-id=229-16061" style="color:#9ecbff;">AI-Credits</a>.</span>
  </div>

  <div class="page">
    <div class="v3-wrap" id="v3-root"></div>
  </div>

  <script>
    (function () {
      var discountInput = document.getElementById("discount");
      var tierSelectId = "tier-select";

      var TIERS = [
        {
          value: "20",
          selectLabel: "3,000 credits / month",
          addonPrice: 20,
          creditsLine: "4,000 AI credits/month",
          vibeLine: "2 published vibe app"
        },
        {
          value: "40",
          selectLabel: "4,000 credits / month",
          addonPrice: 40,
          creditsLine: "8,000 AI credits/month",
          vibeLine: "4 published vibe app"
        },
        {
          value: "80",
          selectLabel: "8,000 credits / month",
          addonPrice: 80,
          creditsLine: "16,000 AI credits/month",
          vibeLine: "6 published vibe app"
        },
        {
          value: "170",
          selectLabel: "20,000 credits / month",
          addonPrice: 170,
          creditsLine: "32,000 AI credits/month",
          vibeLine: "8 published vibe app"
        }
      ];

      var selectedTierValue = "20";

      function getTier() {
        for (var i = 0; i < TIERS.length; i++) {
          if (TIERS[i].value === selectedTierValue) return TIERS[i];
        }
        return TIERS[0];
      }

      function selectOptionsHtml() {
        var html = "";
        TIERS.forEach(function (t) {
          html +=
            '<option value="' +
            t.value +
            '"' +
            (t.value === selectedTierValue ? " selected" : "") +
            ">" +
            t.selectLabel +
            "</option>";
        });
        return html;
      }

      var USAGE_TRIAL_TOTAL = 6000;

      /** creditsUsed sum to USAGE_TRIAL_TOTAL. Master bar = credits; tiles = work + credit caption. */
      var FEATURE_USAGE = [
        {
          shortLabel: "Agents",
          brand: "monday agents",
          creditsUsed: 3200,
          actionCount: 1120,
          workNoun: "tasks",
          accentLine: "53% of routine work — handled",
          color: "#0073ea",
          icon: "agents"
        },
        {
          shortLabel: "Sidekick",
          brand: "monday sidekick",
          creditsUsed: 320,
          actionCount: 340,
          workNoun: "Sidekick answers",
          accentLine: "One AI coworker with full business context",
          color: "#ea580c",
          icon: "sidekick"
        },
        {
          shortLabel: "Workflows",
          brand: "monday workflows",
          creditsUsed: 480,
          actionCount: 840,
          workNoun: "workflow runs",
          accentLine: "Run work end-to-end",
          color: "#00c875",
          icon: "workflows"
        },
        {
          shortLabel: "Notetaker",
          brand: "monday notetaker",
          creditsUsed: 2000,
          actionCount: 840,
          workNoun: "meetings captured",
          accentLine: "Turn meetings into clear action items",
          color: "#9333ea",
          icon: "notetaker"
        }
      ];

      function metricIcons() {
        return {
          agents:
            '<svg width="36" height="36" viewBox="0 0 36 36" aria-hidden="true"><circle cx="10" cy="18" r="5" fill="#00c2cb"/><circle cx="18" cy="12" r="5" fill="#0073ea"/><circle cx="26" cy="18" r="5" fill="#6b6bff"/></svg>',
          sidekick:
            '<svg width="36" height="36" viewBox="0 0 36 36" aria-hidden="true"><defs><linearGradient id="usageGradSidekick" x1="0" y1="0" x2="36" y2="36"><stop stop-color="#f59e0b"/><stop offset="1" stop-color="#ec4899"/></linearGradient></defs><path d="M18 4l4 10 10 1-8 7 2 10-8-5-8 5 2-10-8-7 10-1z" fill="url(#usageGradSidekick)" /></svg>',
          workflows:
            '<svg width="36" height="36" viewBox="0 0 36 36" aria-hidden="true"><circle cx="18" cy="18" r="14" fill="none" stroke="#0073ea" stroke-width="2.5"/><path d="M18 10v8l6 4" fill="none" stroke="#0073ea" stroke-width="2" stroke-linecap="round"/></svg>',
          notetaker:
            '<svg width="36" height="36" viewBox="0 0 36 36" aria-hidden="true"><rect x="8" y="20" width="3" height="10" rx="1" fill="#a855f7"/><rect x="14" y="12" width="3" height="18" rx="1" fill="#0073ea"/><rect x="20" y="16" width="3" height="14" rx="1" fill="#22c55e"/><rect x="26" y="8" width="3" height="22" rx="1" fill="#f59e0b"/></svg>'
        };
      }

      function formatNum(n) {
        return n.toLocaleString("en-US");
      }

      function pctOfTrial(credits) {
        return Math.round((10000 * credits) / USAGE_TRIAL_TOTAL) / 100;
      }

      function valueMetricsHtml() {
        var ic = metricIcons();
        var segs = "";
        var keys = "";
        var tiles = "";
        FEATURE_USAGE.forEach(function (f) {
          var fillPct = (100 * f.creditsUsed) / USAGE_TRIAL_TOTAL;
          var pct = pctOfTrial(f.creditsUsed);
          segs +=
            '<span class="usage-composition__seg" style="width:' +
            fillPct +
            "%;background:" +
            f.color +
            '" title="' +
            f.shortLabel +
            ": " +
            formatNum(f.creditsUsed) +
            ' credits (' +
            pct +
            '%)"></span>';
          keys +=
            '<div class="usage-key-cell">' +
            '<div class="usage-key-cell__dot" style="background:' +
            f.color +
            '"></div>' +
            '<div class="usage-key-cell__name">' +
            f.shortLabel +
            "</div>" +
            '<div class="usage-key-cell__pct">' +
            pct +
            "%</div>" +
            '<div class="usage-key-cell__cr">' +
            formatNum(f.creditsUsed) +
            " cr</div>" +
            "</div>";
          tiles +=
            '<article class="usage-tile">' +
            '<div class="usage-tile__top">' +
            '<div class="usage-tile__icon">' +
            ic[f.icon] +
            "</div>" +
            "<div>" +
            '<div class="usage-tile__brand">' +
            f.brand +
            "</div>" +
            '<div class="usage-tile__metric">' +
            '<span class="usage-tile__num">' +
            formatNum(f.actionCount) +
            "</span>" +
            '<span class="usage-tile__unit">' +
            f.workNoun +
            "</span>" +
            "</div>" +
            '<p class="usage-tile__insight">' +
            f.accentLine +
            "</p>" +
            "</div>" +
            "</div>" +
            '<div class="usage-tile__credit">' +
            '<span class="usage-tile__credit-dot" style="background:' +
            f.color +
            '"></span>' +
            "<span><strong>" +
            formatNum(f.creditsUsed) +
            " credits</strong> · " +
            pct +
            "% of trial</span>" +
            "</div>" +
            "</article>";
        });
        return (
          '<div class="usage-panel" role="region" aria-label="AI usage infographic">' +
          '<p class="usage-eyebrow">Credit split</p>' +
          '<div class="usage-composition">' +
          '<div class="usage-composition__bar" role="img" aria-label="Trial credits by feature">' +
          segs +
          "</div>" +
          '<div class="usage-composition__key">' +
          keys +
          "</div>" +
          "</div>" +
          '<hr class="usage-panel__rule" />' +
          '<p class="usage-eyebrow">Outcomes</p>' +
          '<div class="usage-detail-grid">' +
          tiles +
          "</div>" +
          "</div>"
        );
      }

      function trialBlockHtml() {
        return (
          '<div class="trial-row">' +
          '<span class="lbl">One-time AI trial credits</span>' +
          '<span class="nums">6,000 / 6,000 <span>credits used</span></span>' +
          "</div>" +
          '<div class="trial-bar-frame"><div class="trial-bar" role="progressbar" aria-valuenow="6000" aria-valuemin="0" aria-valuemax="6000">' +
          '<span></span></div></div>'
        );
      }

      function render() {
        var d = Math.max(0, parseInt(discountInput.value, 10) || 0);
        discountInput.value = String(d);
        var tier = getTier();
        var net = Math.max(0, tier.addonPrice - d);
        var netClass = "net" + (net === 0 ? " is-zero" : "");
        var opts = selectOptionsHtml();
        var bannerOff = d > 0 ? "Get $" + d + " /mo off" : "Promo";

        document.getElementById("v3-root").innerHTML =
          '<header class="v3-header">' +
          "<h1 class=\"v3-title\">In our AI Work Platform, credits are part of your plan</h1>" +
          '<p class="v3-sub">Update your plan to include AI credits, so everything stays on one bill.</p>' +
          '<p class="v3-meta">' +
          '<span>Current Plan: <strong>Standard</strong></span>' +
          '<span aria-hidden="true">·</span>' +
